<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}">
  {%- include head.html -%}

  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
  <script src="{{ '/assets/js/mouse_click.js' | relative_url }}"></script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async
x  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>


  <body a="{{ site.theme_config.appearance | default: "auto" }}">



    <main class="page-content" aria-label="Content">
        {% if page.full_width %}
    <div class="w-full">
      {{ content }}
    </div>
  {% else %}
    <div class="w">
      {{ content }}
    </div>
  {% endif %}
    </main>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}

    <!-- {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script type="text/javascript" src="{{ site.baseurl }}/assets/js/{{ js_file }}.js"></script>
      {% endfor %}
    {% endif %} -->

    {% if page.custom_js %}
    {% for js_file in page.custom_js %}
      <script src="{{ '/assets/js/' | append: js_file | append: '.js' | relative_url }}"></script>
    {% endfor %}
  {% endif %}
  

  

    



  </body>
</html>
